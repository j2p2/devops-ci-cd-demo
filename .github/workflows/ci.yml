name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run formatting check (Black)
        run: |
          black --check app tests

      - name: Run linting (flake8)
        run: |
          flake8 app tests

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t devops-ci-cd-demo .
    
      - name: Scan Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: devops-ci-cd-demo
          format: table
          exit-code: 0